# Bootstrap configuration. Install this file first, then let Certbot add the TLS
# listener and HTTP-to-HTTPS redirect. The API container is localhost-only.
limit_req_zone $binary_remote_addr zone=markdown_sync:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sync.markdown.mysolon.gr;

    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=markdown_sync burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
}
