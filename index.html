<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f4" />

    <!--
      Resolve the theme before first paint, otherwise a dark-mode user gets a
      white flash while the bundle loads. useTheme takes over from here; the
      two must agree on the storage key and the data-theme attribute.
    -->
    <script src="/theme-init.js"></script>
    <!--
      A tab left open across a deployment can still ask for an old hashed
      module. Recover before the app bundle runs, including when the entry
      module itself is the stale asset.
    -->
    <script src="/stale-build-recovery.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YMM" />
    <meta
      name="description"
      content="Offline markdown editor with inline comments. Exports clean GFM."
    />
    <title>Yiannis Mertzanis' Markdown</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
