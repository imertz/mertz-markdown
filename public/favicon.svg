      <stop offset="0" stop-color="#faf9f7"/>
      <stop offset="0.52" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#f2efe9"/>
    </linearGradient>
  </defs>

  <rect width="1254" height="1254" rx="235" fill="url(#tile)"/>

