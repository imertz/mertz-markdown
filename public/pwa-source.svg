<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="Yiannis Mertzanis' Markdown">
  <!--
    Maskable-safe source icon, and the master the whole set derives from:
    pwa-assets.config.ts rasterises this into the PNGs and the .ico, and
    favicon.svg is the same art with rounded corners instead of the bleed.

    Two things here are not decoration:
    - The rect overshoots the viewBox, because the maskable output is rendered
      edge to edge and a flush rect leaves a hairline seam.
    - The monogram is scaled to 0.9 about the centre. At full size its outermost
      points (the Y's top corners) sit at radius ~498 against the 80% safe
      area's 501.6 — inside, but by nothing. 0.9 brings that to ~448.
  -->
  <defs>
    <!-- Two-stop gradients, not flat fills: a flat terracotta square at 512px
         reads as a swatch. The stops are the app's own tokens (accent darkened
         for the falloff; bg to code-bg for the mark). Custom-property names are
         spelled out rather than quoted here because a double hyphen is illegal
         inside an XML comment and the generator parses this file strictly. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3512f"/>
      <stop offset="0.5" stop-color="#b3512f"/>
      <stop offset="1" stop-color="#a5482a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f7"/>
      <stop offset="0.52" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#f2efe9"/>
    </linearGradient>
  </defs>

  <!-- Bled 6 units past the viewBox so rasterising leaves no hairline edge. -->
  <rect x="-6" y="-6" width="1266" height="1266" fill="url(#tile)"/>

  <g fill="url(#mark)" transform="translate(627 627) scale(0.9) translate(-627 -627)">
    <!-- Central Y with integrated downward arrow -->
    <path d="M 320 235 H 458 L 627.5 419 L 797 235 H 935 L 679 503 V 889 H 763 L 627.5 1045 L 492 889 H 576 V 503 Z"/>
    <!-- Left outer M stroke -->
    <path d="M 248 350 L 479 595 L 548 524 V 645 L 479 719 L 331 562 V 905 H 248 Z"/>
    <!-- Right outer M stroke -->
    <path d="M 1007 350 L 776 595 L 707 524 V 645 L 776 719 L 924 562 V 905 H 1007 Z"/>
    <!-- Inner descending M strokes -->
    <path d="M 375 669 L 458 755 V 990 L 375 905 Z"/>
    <path d="M 880 669 L 797 755 V 990 L 880 905 Z"/>
  </g>
</svg>
